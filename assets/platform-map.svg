<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<title id="t">The Autheo stack</title>
<desc id="d">Top to bottom: (2) the Autheo app ecosystem; (1) DevHub by Autheo Labs with its IDE toolkit, full-stack SDKs, workflow/DAG tool and agentic OS, which deploys to the Layer 0 mesh; the Layer 0 mesh with distributed compute, compute fabric, data fabric, network fabric and identity and trust; (3) the compute and storage marketplace where providers sell L0 capacity paid in THEO; and the Autheo L1 blockchain underneath everything, with testnet (chain 785) and mainnet (autheo_2127-1). THEO prices and settles every layer.</desc>
