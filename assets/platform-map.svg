<title id="t">Autheo platform map</title>
<desc id="d">Surface 1, DevHub by Autheo Labs (IDE toolkit, full-stack SDKs, workflow and DAG tool, agentic OS), feeds surface 3, the compute and storage marketplace, and surface 2, the Autheo app ecosystem. Developer usage flows from the compute marketplace into the app ecosystem. All of it is priced and settled in THEO on the Autheo L1 blockchain, which has a testnet and a mainnet.</desc>
